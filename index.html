<!-- Plein écran : la page passe sous la barre d'état (heure, batterie), les commandes restent sous elle grâce aux marges
     de sécurité (--safe-top…, css/app.css). iOS 26 (bogue WebKit 301108) : dans ce mode, l'appli de l'écran d'accueil
     reçoit une page plus courte que l'écran (de la hauteur de la barre d'état) tant que le document est plus court que
     l'écran, d'où une bande vide en bas. Corrigé dans css/app.css (hauteur minimale de html en mode appli). Ce réglage
     est lu à l'ajout à l'écran d'accueil : une appli déjà installée garde le sien, la correction CSS vaut pour les deux. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vision AR">
<link rel="stylesheet" href="vendor/leaflet/leaflet.min.css">
<link rel="stylesheet" href="css/app.css">
<script>
// Versions stable (/vision-ar/) et de présentation (/vision-ar-presentation/) : chacune son propre stockage sur
// le téléphone (compte, profil, favoris, réglages), séparé de la version de test (/vision-ar-demo/) : les trois
// sites partagent la même adresse hermes-bit.github.io.
(() => {
  const P = {"vision-ar": "stable:", "vision-ar-presentation": "pres:"}[location.pathname.split("/")[1]];
  if (!P) return;
  try {
    const s = Storage.prototype, get = s.getItem, set = s.setItem, del = s.removeItem;
    const key = (st, k) => st === window.localStorage ? P + k : k;
    s.getItem = function (k) { return get.call(this, key(this, k)); };
    s.setItem = function (k, v) { return set.call(this, key(this, k), v); };
    s.removeItem = function (k) { return del.call(this, key(this, k)); };
  } catch { /* navigation privée : stockage indisponible de toute façon */ }
})();
</script>
<script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("va-theme")) || "verre"; } catch { /* thème par défaut */ }</script>
<script>
// iOS 26, appli lancée depuis l'écran d'accueil (bogue WebKit 301108, voir css/app.css) : tant que le document est
// plus court que l'écran, l'iPhone donne à l'appli une zone d'affichage plus courte que l'écran (de la hauteur de la
// barre d'état) et laisse une bande vide en bas (capture du 25/10, ~62 points). On donne au document la hauteur de
// l'écran : l'iPhone donne alors tout l'écran à l'appli. navigator.standalone : seul repère sûr sans manifeste
// (pas de manifeste sur iPhone, pour l'icône) ; la règle CSS « display-mode » ne s'y déclenchait pas.
(() => {
  if (navigator.standalone !== true) return;
  const html = document.documentElement;
  html.classList.add("ios-app");
  const fit = () => {
    const portrait = innerHeight >= innerWidth;
    const full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    html.style.minHeight = `${full}px`;                  // jamais retiré : sinon l'iPhone raccourcirait à nouveau
  };
  fit();
  addEventListener("orientationchange", () => setTimeout(fit, 300));
  addEventListener("resize", fit);
})();
</script>
<script>
// Téléphone virtuel (telephone.html, pour essayer l'appli sur ordinateur) : l'appli affichée dans le simulateur lui
// confie son GPS, sa boussole et sa caméra, avant que son code ne démarre. Sans aucun effet en dehors du simulateur.
try { if (window.parent !== window && /[?&]sim\b/.test(location.search)) window.parent.__vaSim?.(window); } catch { /* autre site */ }
</script>
<!-- (l'ancien calcul « --vp-gap », qui prolongeait l'appli sous la page, est retiré : la bande n'était pas dessinable,
     et avec la barre d'état « default » la page a déjà la bonne hauteur ; --vp-gap reste à 0 dans css/app.css) -->
<script>
// Logo choisi dans les Paramètres (Paramètres → Logo sur l'écran d'accueil), copie intégrée gardée sur le téléphone.
// Manifeste : seulement hors iPhone. Depuis iOS 17.4, l'iPhone prend l'icône dans le manifeste s'il y en a un
// et doit alors la télécharger, ce qui échoue sur certains appareils (lettre « V » à la place du logo).
(() => {
  let logo = "vert";
  try {
    const l = JSON.parse(localStorage.getItem("va-logo")), data = localStorage.getItem("va-logo-icon");
    if (["soleil", "nuit", "pastille"].includes(l)) logo = l;
    if (logo !== "vert" && data && data.startsWith("data:image/png")) document.getElementById("touchIcon").href = data;
    if (logo !== "vert") document.querySelector('link[rel="icon"]').href = `icons/logos/${logo}/favicon-32.png?v=3`;
  } catch { /* logo par défaut */ }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (!ios) {
    const m = document.createElement("link");
    m.rel = "manifest"; m.href = (logo === "vert" ? "manifest.webmanifest" : `manifest-${logo}.webmanifest`) + "?v=3";
    document.head.append(m);
  }
})();
</script>
